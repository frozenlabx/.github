name: 🐛 Bug Report
description: Create a report to help us reproduce and fix a bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please search existing issues first to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. In project '...'
        2. Call '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: code_snippet
    attributes:
      label: Minimal Reproducible Code Example
      description: Please share a short code snippet reproducing the problem.
      render: dart
      placeholder: |
        // Paste minimal reproducible code here

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: Output of `flutter doctor -v` or relevant runtime / SDK versions.
      render: shell
      placeholder: |
        Flutter version:
        Dart SDK version:
        OS:
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have provided a minimal reproducible example where possible.
          required: false
