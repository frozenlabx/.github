name: 💡 Feature Request
description: Suggest an idea or enhancement for a project
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to improve FrozenLab software!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem? A clear description of the challenge you are facing.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution or API Design
      description: Describe what you would like to happen and how you envision the API looking.
      placeholder: Describe the desired feature or API signature...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.
      placeholder: Describe other approaches you tried...
    validations:
      false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples here.
    validations:
      false
